<script>
(function () {
  'use strict';
  var $ = AST.$;

  var CATS = {
    length: {
      label: 'Length',
      units: [['Millimeters', 'mm'], ['Centimeters', 'cm'], ['Meters', 'm'], ['Kilometers', 'km'],
              ['Inches', 'in'], ['Feet', 'ft'], ['Miles', 'mi']],
      toBase: { mm: 0.001, cm: 0.01, m: 1, km: 1000, in: 0.0254, ft: 0.3048, mi: 1609.344 }
    },
    weight: {
      label: 'Weight',
      units: [['Grams', 'g'], ['Kilograms', 'kg'], ['Pounds', 'lb'], ['Ounces', 'oz']],
      toBase: { g: 1, kg: 1000, lb: 453.59237, oz: 28.349523125 }
    },
    temperature: {
      label: 'Temperature',
      units: [['Celsius', 'C'], ['Fahrenheit', 'F'], ['Kelvin', 'K']],
      special: true
    },
    data: {
      label: 'Data',
      units: [['Bytes', 'B'], ['Kilobytes', 'KB'], ['Megabytes', 'MB'], ['Gigabytes', 'GB'], ['Terabytes', 'TB']],
      toBase: { B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 }
    }
  };

  /* Core — exposed for tests */
  function convertUnit(cat, value, from, to) {
    var c = CATS[cat];
    if (!c) throw new Error('Unknown category');
    var v = parseFloat(value);
    if (!isFinite(v)) return NaN;
    if (c.special) {
      var k = from === 'C' ? v + 273.15 : from === 'F' ? (v + 459.67) * 5 / 9 : v;
      return to === 'C' ? k - 273.15 : to === 'F' ? k * 9 / 5 - 459.67 : k;
    }
    return v * c.toBase[from] / c.toBase[to];
  }
  AST.convertUnit = convertUnit;
  AST._unitCats = CATS;

  var cat = 'length', editing = null;

  function fillUnits() {
    var c = CATS[cat];
    var fs = $('#uc-from-unit'), ts = $('#uc-to-unit');
    fs.innerHTML = ''; ts.innerHTML = '';
    c.units.forEach(function (u) {
      var o1 = document.createElement('option'); o1.value = u[1]; o1.textContent = u[0] + ' (' + u[1] + ')';
      var o2 = o1.cloneNode(true);
      fs.appendChild(o1); ts.appendChild(o2);
    });
    var defaults = { length: ['m', 'ft'], weight: ['kg', 'lb'], temperature: ['C', 'F'], data: ['MB', 'GB'] };
    fs.value = defaults[cat][0]; ts.value = defaults[cat][1];
    $('#uc-a-label').textContent = 'Value (' + fs.value + ')';
    $('#uc-b-label').textContent = 'Result (' + ts.value + ')';
  }

  function fmt(n) {
    if (!isFinite(n)) return '';
    var a = Math.abs(n);
    if (a !== 0 && (a >= 1e15 || a < 1e-9)) return n.toExponential(6);
    return String(Math.round(n * 1e10) / 1e10);
  }

  function convertFromA() {
    editing = 'a';
    var r = convertUnit(cat, $('#uc-a').value, $('#uc-from-unit').value, $('#uc-to-unit').value);
    $('#uc-b').value = fmt(r);
    showFormula();
  }
  function convertFromB() {
    editing = 'b';
    var r = convertUnit(cat, $('#uc-b').value, $('#uc-to-unit').value, $('#uc-from-unit').value);
    $('#uc-a').value = fmt(r);
    showFormula();
  }
  function showFormula() {
    var a = $('#uc-a').value, b = $('#uc-b').value;
    $('#uc-formula').textContent = a !== '' && b !== ''
      ? a + ' ' + $('#uc-from-unit').value + ' = ' + b + ' ' + $('#uc-to-unit').value
      : '';
  }

  document.querySelectorAll('#uc-tabs .tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('#uc-tabs .tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      cat = t.getAttribute('data-cat');
      fillUnits();
      $('#uc-a').value = '1';
      convertFromA();
    });
  });

  $('#uc-a').addEventListener('input', convertFromA);
  $('#uc-b').addEventListener('input', convertFromB);
  $('#uc-from-unit').addEventListener('change', function () {
    $('#uc-a-label').textContent = 'Value (' + this.value + ')';
    convertFromA();
  });
  $('#uc-to-unit').addEventListener('change', function () {
    $('#uc-b-label').textContent = 'Result (' + this.value + ')';
    convertFromA();
  });
  $('#uc-swap').addEventListener('click', function () {
    var f = $('#uc-from-unit'), t = $('#uc-to-unit');
    var tmp = f.value; f.value = t.value; t.value = tmp;
    $('#uc-a-label').textContent = 'Value (' + f.value + ')';
    $('#uc-b-label').textContent = 'Result (' + t.value + ')';
    convertFromA();
  });
  $('#uc-copy').addEventListener('click', function () {
    AST.copyText($('#uc-formula').textContent || $('#uc-b').value, 'Result copied');
  });

  fillUnits();
  convertFromA();
})();
</script>
