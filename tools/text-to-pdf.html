<script>
(function () {
  'use strict';
  var $ = AST.$;

  /* Core builder — exposed for tests. Returns a Blob. */
  function textToPdf(title, text, fontSize) {
    if (typeof window.jspdf === 'undefined') throw new Error('PDF library failed to load.');
    text = String(text || '');
    if (!text.trim()) throw new Error('Enter some text first.');
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
    var fs = parseInt(fontSize, 10) || 12;
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    var margin = 56, y = margin, maxW = W - margin * 2;
    var lineH = fs * 1.55;

    if (title && title.trim()) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(Math.min(22, fs + 8));
      var tlines = doc.splitTextToSize(title.trim(), maxW);
      tlines.forEach(function (ln) {
        if (y + 24 > H - margin) { doc.addPage(); y = margin; }
        doc.text(ln, margin, y); y += 24;
      });
      y += 10;
      doc.setDrawColor(212, 175, 55);
      doc.setLineWidth(1.5);
      doc.line(margin, y, margin + 48, y);
      y += 22;
    }
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(fs);
    doc.setTextColor(30, 30, 30);
    var paras = text.split(/\n/);
    paras.forEach(function (para) {
      var lines = doc.splitTextToSize(para === '' ? ' ' : para, maxW);
      lines.forEach(function (ln) {
        if (y + lineH > H - margin) { doc.addPage(); y = margin; }
        if (ln.trim()) doc.text(ln, margin, y);
        y += lineH;
      });
    });
    /* page numbers */
    var n = doc.getNumberOfPages();
    doc.setFontSize(9); doc.setTextColor(130, 130, 130);
    for (var i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.text(String(i) + ' / ' + n, W / 2, H - 30, { align: 'center' });
    }
    doc.setProperties({ title: title || 'AST Text Document', creator: 'AST PDF & QR Studio' });
    return doc.output('blob');
  }
  AST.textToPdf = textToPdf;

  var textEl = $('#t2p-text');
  textEl.addEventListener('input', function () {
    $('#t2p-count').textContent = textEl.value.length.toLocaleString();
  });
  $('#t2p-clear').addEventListener('click', function () {
    textEl.value = ''; $('#t2p-title').value = '';
    $('#t2p-count').textContent = '0'; textEl.focus();
  });
  $('#t2p-make').addEventListener('click', function () {
    AST.clearBox('#t2p-error');
    try {
      var blob = textToPdf($('#t2p-title').value, textEl.value, $('#t2p-size').value);
      var name = ($('#t2p-title').value.trim() || 'ast-document')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') + '.pdf';
      AST.download(blob, name);
      AST.toast('PDF downloaded');
    } catch (e) {
      AST.showError('#t2p-error', e.message || 'Could not create the PDF.');
    }
  });
})();
</script>
